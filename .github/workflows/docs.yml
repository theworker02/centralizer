name: docs

on:
  push:
    branches: [main, master]
    paths: [website/**, docs/**, "*.md"]
  pull_request:
    paths: [website/**, docs/**, "*.md"]

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build
